<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280">
<style>
.lbl{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6B665E;letter-spacing:3px}
.name{font:900 104px 'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#111111;letter-spacing:-5px}
.dot{fill:#FF6A13}
.tag{font:600 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#111111;opacity:0;animation:cycle 12s infinite}
.pr{font:700 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#FF6A13}
.pill{font:800 13px 'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#111111;letter-spacing:2px}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1s .5s cubic-bezier(.2,.8,.2,1) both}
.cur{animation:blink 1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes cycle{0%{opacity:0;transform:translateY(8px)}3.00%{opacity:1;transform:none}21.25%{opacity:1;transform:none}25.00%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
</style>
<rect x="8" y="8" width="824" height="264" rx="22" fill="#111111"/>
<rect x="2" y="2" width="824" height="264" rx="22" fill="#F6F1E9" stroke="#111111" stroke-width="2.5"/>
<g class="rise"><text class="lbl" x="44" y="58">HELLO, I'M</text></g>
<g class="rise" style="animation-delay:.15s"><text class="name" x="38" y="158">Mo Syed<tspan class="dot">.</tspan></text></g>
<rect class="bar" x="44" y="178" width="250" height="8" rx="4" fill="#FF6A13"/>
<text class="pr" x="44" y="232">&gt;</text>
<text class="tag" style="animation-delay:1.2s" x="74" y="232">building Checkie, the bill-splitting app</text>
<text class="tag" style="animation-delay:4.2s" x="74" y="232">ex founding engineer @ Outfox Health</text>
<text class="tag" style="animation-delay:7.2s" x="74" y="232">Python · TypeScript · React Native</text>
<text class="tag" style="animation-delay:10.2s" x="74" y="232">based in New York, open to new roles</text>
<g class="rise" style="animation-delay:.35s">
<rect x="608" y="44" width="196" height="40" rx="20" fill="#111111"/>
<rect x="603" y="39" width="196" height="40" rx="20" fill="#FF6A13" stroke="#111111" stroke-width="2"/>
<text class="pill" x="701" y="64" text-anchor="middle">SOFTWARE ENGINEER</text>
<rect x="680" y="96" width="124" height="34" rx="17" fill="#111111"/>
<rect x="675" y="91" width="124" height="34" rx="17" fill="#F6F1E9" stroke="#111111" stroke-width="2"/>
<text class="pill" x="737" y="113" text-anchor="middle">NEW YORK</text>
</g>
</svg>